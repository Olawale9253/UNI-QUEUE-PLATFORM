<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/uniqueue-icon.png" />
  <link rel="shortcut icon" type="image/png" href="/uniqueue-icon.png" />
  <link rel="apple-touch-icon" href="/uniqueue-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
          rel="stylesheet"
  />
  <meta name="description" content="UniQueue — Multi-tenant queue management for universities" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="color-scheme" content="light dark" />

  <!-- Prevent flash of light mode before React mounts -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <title>UniQueue</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
