<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/uniqueue-icon.png" />
  <link rel="shortcut icon" type="image/png" href="/uniqueue-icon.png" />
  <link rel="apple-touch-icon" href="/uniqueue-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
          rel="stylesheet"
  />
  <meta name="description" content="UniQueue — Multi-tenant queue management for universities" />
  <meta name="theme-color" content="#4f46e5" />
  <!-- FIXED: Force the browser to start with a light canvas -->
  <meta name="color-scheme" content="light" />

  <!-- FIXED: Set default background colors immediately -->
  <style>
    html {
      background-color: #f8fafc; /* slate-50 */
    }
    html.dark {
      background-color: #020617; /* slate-950 */
    }
  </style>

  <!-- 1. Prevent flash of dark mode before React mounts -->
  <script>
    (function () {
      try {
        // Use the correct key 'uniqueue_theme' to match the store
        var savedTheme = localStorage.getItem('uniqueue_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        // If saved is dark, OR if nothing is saved and system is dark -> use dark
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- 2. Force reload on version change (iOS PWA fix) -->
  <script>
    (function () {
      try {
        // ⚠️ IMPORTANT: Change this string every time you deploy a major update!
        var APP_VERSION = '1.0.2'; // Bumped version
        var cachedVersion = localStorage.getItem('app-version');

        if (cachedVersion && cachedVersion !== APP_VERSION) {
          console.log('App version changed. Forcing reload...');
          localStorage.setItem('app-version', APP_VERSION);
          window.location.reload();
        } else {
          localStorage.setItem('app-version', APP_VERSION);
        }
      } catch (e) {}
    })();
  </script>

  <title>UniQueue</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
