spring.application.name=uniqueue

# H2 in-memory database
spring.datasource.url=jdbc:h2:file:./data/uniqueuedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# JPA — auto-create tables from @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway — disabled in dev (Hibernate handles schema)
spring.flyway.enabled=false

# JWT — MUST be at least 32 characters for HS256
app.jwt.secret=uniqueeue-super-secret-dev-key-change-in-production-2026-32chars-plus
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# CORS — where the React frontend will live
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000