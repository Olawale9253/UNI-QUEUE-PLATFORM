spring.application.name=uniqueue

# ─── Database (Postgres in prod) ───
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# ─── H2 console OFF in prod ───
spring.h2.console.enabled=false

# ─── Multipart ───
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=256KB

# ─── JWT ───
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# ─── Email / SMTP ───
app.email.enabled=true
app.email.from=${EMAIL_FROM}
app.email.reply-to=${EMAIL_REPLY_TO}
app.email.base-url=${APP_BASE_URL}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.default-encoding=UTF-8

# ─── Security ───
app.security.log-verification-codes=false

# ─── CORS ───
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ─── Seeder (from env) ───
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.seed.admin.email=${SEED_ADMIN_EMAIL:}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}

# ─── Logging ───
logging.level.com.uniqueeue=INFO
logging.level.com.uniqueeue.service.EmailService=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.com.uniqueeue.security.JwtTokenProvider=ERROR

# ─── Cleanup ───
app.cleanup.delete-unverified-accounts=true
app.cleanup.unverified-account-age-days=30

# ─── File storage ───
app.storage.base-path=${STORAGE_BASE_PATH:/var/data/uploads}
app.storage.max-file-size=5242880
app.storage.allowed-types=application/pdf,image/jpeg,image/png,image/jpg,image/webp

# ─── Web Push ───
app.push.vapid-public-key=${VAPID_PUBLIC_KEY}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY}
app.push.subject=${VAPID_SUBJECT:mailto:admin@example.com}

# ─── Bottlenecks ───
uniqueue.bottlenecks.min-avg-hours=0
uniqueue.bottlenecks.min-stuck=1
uniqueue.bottlenecks.dry-run=false