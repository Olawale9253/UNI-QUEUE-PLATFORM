spring.application.name=uniqueue

# H2 persistent file-based database
spring.datasource.url=jdbc:h2:file:./data/uniqueuedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=256KB

# JWT — secrets come from application-local.properties (dev) or env vars (prod)
app.jwt.secret=${JWT_SECRET:changeme-dev-placeholder}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# ═══════════════════════════════════════════════════════════
#  Email / SMTP
# ═══════════════════════════════════════════════════════════

app.email.enabled=true

app.email.from=${EMAIL_FROM:UniQueue <no-reply@uniqueue.local>}
app.email.reply-to=${EMAIL_REPLY_TO:no-reply@uniqueue.local}
app.email.base-url=${APP_BASE_URL:http://localhost:5173}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.default-encoding=UTF-8

logging.level.com.uniqueeue.service.EmailService=INFO

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.cleanup.delete-unverified-accounts=true
app.cleanup.unverified-account-age-days=30

app.storage.base-path=./data/uploads
app.storage.max-file-size=5242880
app.storage.allowed-types=application/pdf,image/jpeg,image/png,image/jpg,image/webp

# Web Push — public key is safe to commit. Private key is a secret.
app.push.vapid-public-key=BLZwzyWDM9Iz7uDEt3rJpNqmW7s1bDl3eOZMv7FH5kzhnEhdCq3mZ8sbY71-Orsm2jbxzXqA0hGnbSTV8sToXXY
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:admin@uniqueue.app}

uniqueue.bottlenecks.min-avg-hours=2.0
uniqueue.bottlenecks.min-stuck=1
uniqueue.bottlenecks.dry-run=true