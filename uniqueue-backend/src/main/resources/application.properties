spring.application.name=uniqueue

# ═══════════════════════════════════════════════════════════
#  Server & Port (Required for Render)
# ═══════════════════════════════════════════════════════════
server.port=${PORT:8080}
server.address=0.0.0.0

# 🔧 THIS IS THE MAGIC FIX: Starts Tomcat instantly to prevent Render timeouts
spring.main.lazy-initialization=true

# ═══════════════════════════════════════════════════════════
#  Database Configuration (Neon PostgreSQL)
# ═══════════════════════════════════════════════════════════
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (Database Migrations)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ═══════════════════════════════════════════════════════════
#  File Uploads
# ═══════════════════════════════════════════════════════════
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=256KB

# ═══════════════════════════════════════════════════════════
#  JWT
# ═══════════════════════════════════════════════════════════
app.jwt.secret=${JWT_SECRET:changeme-dev-placeholder}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# ═══════════════════════════════════════════════════════════
#  Email (Brevo HTTP API - Bypasses Render SMTP Port Block)
# ═══════════════════════════════════════════════════════════
app.email.enabled=true

app.email.from=${EMAIL_FROM:UniQueue <no-reply@uniqueue.local>}
app.email.reply-to=${EMAIL_REPLY_TO:no-reply@uniqueue.local}
app.email.base-url=${APP_BASE_URL:http://localhost:5173}

# Brevo API Key (from Brevo Dashboard -> SMTP & API -> API Keys)
app.email.brevo-api-key=${BREVO_API_KEY:}

logging.level.com.uniqueeue.service.EmailService=INFO

# ═══════════════════════════════════════════════════════════
#  App Specific
# ═══════════════════════════════════════════════════════════
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.cleanup.delete-unverified-accounts=true
app.cleanup.unverified-account-age-days=30

app.storage.base-path=./data/uploads
app.storage.max-file-size=5242880
app.storage.allowed-types=application/pdf,image/jpeg,image/png,image/jpg,image/webp

# Web Push
app.push.vapid-public-key=BLZwzyWDM9Iz7uDEt3rJpNqmW7s1bDl3eOZMv7FH5kzhnEhdCq3mZ8sbY71-Orsm2jbxzXqA0hGnbSTV8sToXXY
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:admin@uniqueue.app}

uniqueue.bottlenecks.min-avg-hours=2.0
uniqueue.bottlenecks.min-stuck=1
uniqueue.bottlenecks.dry-run=true