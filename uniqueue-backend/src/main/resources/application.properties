spring.application.name=uniqueue

# H2 persistent file-based database
spring.datasource.url=jdbc:h2:file:./data/uniqueuedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false

# Multipart (file upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=256KB

# JWT
app.jwt.secret=uniqueeue-super-secret-dev-key-change-in-production-2026-32chars-plus
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# ═══════════════════════════════════════════════════════════
#  Email / SMTP
# ═══════════════════════════════════════════════════════════

# Master switch — turn OFF here, ON in production
app.email.enabled=true

app.email.from=UniQueue <taofeekolawale159@gmail.com>
app.email.reply-to=taofeekolawale159@gmail.com
app.email.base-url=http://localhost:5173

# ── SMTP ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=taofeekolawale159@gmail.com
spring.mail.password=uyvhshphafoznqqv
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.default-encoding=UTF-8

# Dev only: show the HTML body in logs
logging.level.com.uniqueeue.service.EmailService=INFO

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Cleanup jobs
app.cleanup.delete-unverified-accounts=true
app.cleanup.unverified-account-age-days=30

# File storage
app.storage.base-path=./data/uploads
app.storage.max-file-size=5242880
app.storage.allowed-types=application/pdf,image/jpeg,image/png,image/jpg,image/webp

