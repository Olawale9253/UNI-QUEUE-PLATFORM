# ── Test profile: in-memory H2, fresh schema per run ──
spring.datasource.url=jdbc:h2:mem:uniqueue-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Don't send real emails or run schedulers ──
app.email.enabled=false
uniqueue.bottlenecks.enabled=false
uniqueue.bottlenecks.dry-run=true

# ── Faster boot ──
spring.main.lazy-initialization=true
logging.level.root=WARN
logging.level.com.uniqueeue=INFO